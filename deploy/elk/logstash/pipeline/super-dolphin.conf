input {
  file {
    path => ["/var/log/super-dolphin/tmp/**/*.log"]
    mode => "tail"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb-super-dolphin"
    discover_interval => 5
    stat_interval => 2
    codec => plain {
      charset => "UTF-8"
    }
  }
}

filter {
  mutate {
    add_field => {
      "[service][name]" => "super-dolphin"
      "[observer][type]" => "local-elk"
    }
  }

  json {
    source => "message"
    target => "super_dolphin"
    skip_on_invalid_json => true
    tag_on_failure => []
  }

  if [super_dolphin][time] {
    date {
      match => ["[super_dolphin][time]", "yyyy-MM-dd HH:mm:ss", "ISO8601"]
      target => "@timestamp"
      timezone => "Asia/Shanghai"
    }
  }

  if [super_dolphin][level] {
    mutate {
      add_field => {
        "[log][level]" => "%{[super_dolphin][level]}"
      }
    }
  }

  if [super_dolphin][msg] {
    mutate {
      copy => {
        "message" => "[super_dolphin][raw_message]"
      }
    }
    mutate {
      replace => {
        "message" => "%{[super_dolphin][msg]}"
      }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "super-dolphin-logs-%{+YYYY.MM.dd}"
  }
}
