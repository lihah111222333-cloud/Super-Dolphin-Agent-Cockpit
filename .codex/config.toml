[features]
hooks = true

[mcp_servers.playwright]
command = "npx"
args = [
    "-y",
    "@playwright/mcp@0.0.75",
]

[mcp_servers.lsp]
enabled = true
type = "stdio"
command = "/Users/mima0000/Desktop/wj/super-agent-v3/bin/mcp-lsp"
args = []
cwd = "/Users/mima0000/Desktop/wj/super-agent-v3"
