# Super Dolphin local pipeline.
# Inputs:
# - Beats on 5044 from Filebeat.
# - JSON-lines TCP on 5000 for direct smoke tests or production sidecars.
input {
  beats {
    port => 5044
  }

  tcp {
    port => 5000
    codec => json_lines {
      # The application already emits ECS-style top-level fields.
      ecs_compatibility => disabled
    }
  }
}

filter {
  # If a shipper forwards a raw JSON line in message, parse it once.
  if [message] =~ "^\s*\{.*\}\s*$" {
    json {
      source => "message"
      target => "parsed_message"
      skip_on_invalid_json => true
    }
    if [parsed_message] {
      ruby {
        code => '
          event.get("parsed_message").each { |k, v| event.set(k, v) unless event.include?(k) }
          event.remove("parsed_message")
        '
      }
    }
  }

  # Derive safe index components from application fields.
  ruby {
    code => '
      service = event.get("[service][name]") || event.get("service.name") || "super-dolphin"
      env = event.get("env") || "dev"
      service = service.to_s.downcase.gsub(/[^a-z0-9_-]+/, "-").gsub(/^-+|-+$/, "")
      env = env.to_s.downcase.gsub(/[^a-z0-9_-]+/, "-").gsub(/^-+|-+$/, "")
      event.set("[@metadata][index_service]", service.empty? ? "super-dolphin" : service)
      event.set("[@metadata][index_env]", env.empty? ? "dev" : env)
    '
  }

  # Application JSON emits @timestamp in ISO-8601. Filebeat may also set one.
  date {
    match => ["@timestamp", "ISO8601"]
    target => "@timestamp"
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "logs-%{[@metadata][index_service]}-%{[@metadata][index_env]}-%{+YYYY.MM.dd}"
  }

  # Local visibility while validating the pipeline.
  stdout {
    codec => rubydebug {
      metadata => false
    }
  }
}
