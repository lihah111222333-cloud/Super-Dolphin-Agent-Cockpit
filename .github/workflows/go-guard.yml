name: go-guard

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Check Chinese commit messages
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..HEAD"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            range="${{ github.event.before }}..${GITHUB_SHA}"
          else
            range="HEAD~1..HEAD"
          fi
          python3 .agents/skills/guarding-go-projects/scripts/check_commit_message.py --range "$range"
      - name: Install guard tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/securego/gosec/v2/cmd/gosec@latest
      - name: Run release guard
        run: make guard-release
        env:
          GO_GUARD_REQUIRE_GOLANGCI: "1"
          GO_GUARD_STRICT_TOOLS: "1"
