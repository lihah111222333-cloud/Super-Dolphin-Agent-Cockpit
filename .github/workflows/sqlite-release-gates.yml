name: SQLite Release Gates

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  truth-image-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      SUPER_DOLPHIN_GUARD_FAIL_ON_DRIFT: "1"
      GATE_EVENT_SHA: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
      GATE_EVENT_REF: ${{ github.event_name == 'pull_request_target' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref }}
      GATE_EVENT_REPOSITORY: ${{ github.repository }}
      SUPER_DOLPHIN_GATE_WORKFLOW_OIDC_AUDIENCE: super-dolphin-gate-workflow
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'pull_request_target' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.sha }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false
      - name: Trusted bootstrap coordinator
        env:
          SUPER_DOLPHIN_GATE_BOOTSTRAP_IMAGE: ${{ secrets.SUPER_DOLPHIN_GATE_BOOTSTRAP_IMAGE }}
          SUPER_DOLPHIN_GATE_AUTHORITY_BUNDLE_B64: ${{ secrets.SUPER_DOLPHIN_GATE_AUTHORITY_BUNDLE_B64 }}
        run: |
          set -euo pipefail
          image_repository="${SUPER_DOLPHIN_GATE_BOOTSTRAP_IMAGE%@sha256:*}"
          if [[ ! "$SUPER_DOLPHIN_GATE_BOOTSTRAP_IMAGE" =~ ^[^[:space:]@]+@sha256:[[:xdigit:]]{64}$ ]] || [[ "${image_repository##*/}" == *:* ]]; then
            echo "immutable bootstrap image digest is required" >&2
            exit 1
          fi
          runtime_root="$(mktemp -d "${RUNNER_TEMP:?}/super-dolphin-gate-runtime.XXXXXX")"
          trap 'rm -rf "$runtime_root"' EXIT
          chmod 700 "$runtime_root"
          docker pull --platform=linux/amd64 "$SUPER_DOLPHIN_GATE_BOOTSTRAP_IMAGE"
          docker run --rm --cpus=4 --memory=8g --mount type=bind,source=/var/run/docker.sock,target=/var/run/docker.sock --mount type=bind,source="$GITHUB_WORKSPACE/candidate",target=/workspace/super-dolphin-checkout,readonly --mount type=bind,source="$runtime_root",target="$runtime_root" --workdir /workspace/super-dolphin-checkout --env SUPER_DOLPHIN_GATE_AUTHORITY_BUNDLE_B64 --env SUPER_DOLPHIN_GATE_WORKFLOW_RUNTIME_ROOT="$runtime_root" --env SUPER_DOLPHIN_GATE_WORKFLOW_OIDC_AUDIENCE --env ACTIONS_ID_TOKEN_REQUEST_URL --env ACTIONS_ID_TOKEN_REQUEST_TOKEN "$SUPER_DOLPHIN_GATE_BOOTSTRAP_IMAGE" workflow-host --repository-root /workspace/super-dolphin-checkout --event-repository "$GATE_EVENT_REPOSITORY" --event-ref "$GATE_EVENT_REF" --event-sha "$GATE_EVENT_SHA"
