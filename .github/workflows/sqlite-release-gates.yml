name: SQLite Release Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-recovery-release-gate-macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Full macOS update recovery release gate
        run: make release-update-gate

  update-recovery-release-gate-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Windows-native update recovery and package verification
        shell: bash
        run: |
          ./scripts/test_with_guard.sh ./cmd/super-dolphin-updater -run 'Test(Guard|ConfigureGuard)' -count=1
          ./scripts/test_with_guard.sh ./cmd/super-dolphin-guard -run 'TestGuard.*(Rollback|Probation|PIDReuse|Termination)' -count=1
          ./scripts/test_with_guard.sh ./scripts -run '^TestWindowsPackageVerifierAcceptsRealFixture$' -count=1

  update-recovery-release-gate-linux-supplemental:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Supplemental Linux update recovery evidence
        run: make release-update-gate

  sqlite-release-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-app/package-lock.json
      - name: Install Linux desktop smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev xvfb
      - name: Prepare embedded frontend assets
        working-directory: frontend-app
        run: |
          npm ci
          npm run build
      - name: Run G1-G14 SQLite release gates
        run: xvfb-run -a go run ./scripts/sqlite_release_gates -logs .sqlite-release-gate-logs -timeout 10m
      - name: Upload SQLite release gate report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sqlite-release-gate-report-full-ubuntu-latest
          path: docs/cc/数据库切换/sqlite-release-gate-report.md
          if-no-files-found: error
      - name: Upload SQLite release gate raw logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sqlite-release-gate-raw-logs-full-ubuntu-latest
          path: .sqlite-release-gate-logs
          if-no-files-found: error
          include-hidden-files: true

  sqlite-packaging-smoke:
    needs: [update-recovery-release-gate-macos, update-recovery-release-gate-windows]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-app/package-lock.json
      - name: Prepare embedded frontend assets
        working-directory: frontend-app
        run: |
          npm ci
          npm run build
      - name: Install Linux desktop smoke dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev xvfb
      - name: Run G12 packaging smoke on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a go run ./scripts/sqlite_release_gates -only G12 -allow-partial -logs .sqlite-release-gate-logs -timeout 10m
      - name: Run G12 packaging smoke on native desktop
        if: runner.os != 'Linux'
        run: go run ./scripts/sqlite_release_gates -only G12 -allow-partial -logs .sqlite-release-gate-logs -timeout 10m
      - name: Upload G12 packaging smoke report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sqlite-release-gate-report-g12-${{ matrix.os }}
          path: docs/cc/数据库切换/sqlite-release-gate-report.md
          if-no-files-found: error
      - name: Upload G12 packaging smoke raw logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sqlite-release-gate-raw-logs-g12-${{ matrix.os }}
          path: .sqlite-release-gate-logs
          if-no-files-found: error
          include-hidden-files: true
