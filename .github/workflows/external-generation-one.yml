name: External ECI image material

on:
  push:
    branches:
      - codex/external-g1-0aec680b1da8-v1

permissions:
  contents: read
  packages: write

jobs:
  material:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CANDIDATE_TREE: 0aec680b1da85a09c55d909cbab2d4a65d737545
      CANDIDATE_COMMIT: 345aa86f585b1d4217034688bec926ad134aacfb
      RUNTIME_REPOSITORY: ghcr.io/lihah111222333-cloud/super-dolphin-runtime-deps
      COMPILED_SEED_REPOSITORY: ghcr.io/lihah111222333-cloud/super-dolphin-compiled-seed
      FINAL_REPOSITORY: ghcr.io/lihah111222333-cloud/super-dolphin-ci-runtime
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover exact candidate tree
        shell: bash
        run: |
          set -euo pipefail
          cp .github/external-generation-one/identity.go /tmp/external-generation-one-identity.go
          rm -rf .github/external-generation-one
          rm -f .github/workflows/external-generation-one.yml
          git add -A
          test "$(git write-tree)" = "$CANDIDATE_TREE"
          test "$(git rev-parse "$CANDIDATE_COMMIT^{tree}")" != "$CANDIDATE_TREE"
          mkdir -p .external-generation-one
          cp /tmp/external-generation-one-identity.go .external-generation-one/identity.go

      - name: Resolve immutable material identity
        shell: bash
        run: |
          set -euo pipefail
          GENERATION_ONE_REPOSITORY="$GITHUB_WORKSPACE" \
          GENERATION_ONE_COMMIT="$CANDIDATE_COMMIT" \
          GENERATION_ONE_TREE="$CANDIDATE_TREE" \
            go run .external-generation-one/identity.go > identity.json
          rm -rf .external-generation-one
          image_input_digest="sha256:$(git ls-tree -rz --full-tree "$CANDIDATE_TREE" | sha256sum | cut -d' ' -f1)"
          jq --arg digest "$image_input_digest" '. + {image_input_digest:$digest}' identity.json > identity.next.json
          mv identity.next.json identity.json
          jq -e '.main_tree == env.CANDIDATE_TREE and .platform == "linux/amd64"' identity.json >/dev/null

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.EXTERNAL_GENERATION_ONE_GHCR_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build or reuse runtime dependency image
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          inspect_digest() {
            docker buildx imagetools inspect "$1" --format '{{json .Manifest.Digest}}' 2>/tmp/runtime-inspect.err | jq -er '.'
          }
          runtime_digest="$(jq -r .runtime_dependency_digest identity.json)"
          runtime_key="${runtime_digest#sha256:}"
          test "${#runtime_key}" -eq 64
          tag="$RUNTIME_REPOSITORY:deps-$runtime_key"
          if digest="$(inspect_digest "$tag")"; then
            reuse_mode=stable-identity-hit
          else
            mapfile -t locked_args < <(jq -r '.runtime_build_args[]' identity.json)
            runtime_args=()
            for item in "${locked_args[@]}"; do runtime_args+=(--build-arg "$item"); done
            runtime_args+=(
              --build-arg "RUNTIME_DEPS_INPUT_DIGEST=$runtime_digest"
              --build-arg "TOOLCHAIN_DIGEST=$(jq -r .toolchain_digest identity.json)"
              --build-arg "TARGET_PLATFORM=linux/amd64"
            )
            git archive --format=tar "$CANDIDATE_TREE" | docker buildx build --platform linux/amd64 --provenance=false \
              -f build/gate/runtime-deps.Dockerfile "${runtime_args[@]}" --push -t "$tag" -
            digest="$(inspect_digest "$tag")"
            reuse_mode=built
          fi
          printf 'runtime_dependency reuse_mode=%s digest=%s\n' "$reuse_mode" "$digest"
          echo "reference=$RUNTIME_REPOSITORY@$digest" >> "$GITHUB_OUTPUT"

      - name: Build or reuse compiled cache image
        id: compiled
        shell: bash
        env:
          RUNTIME_REFERENCE: ${{ steps.runtime.outputs.reference }}
        run: |
          set -euo pipefail
          inspect_digest() {
            docker buildx imagetools inspect "$1" --format '{{json .Manifest.Digest}}' 2>/tmp/compiled-inspect.err | jq -er '.'
          }
          seed_key="$({ jq -r '.main_commit,.main_tree,.gate_source_digest,.runtime_dependency_digest,.image_input_digest,.policy_digest,.toolchain_digest,.platform' identity.json; printf '%s\n' "$RUNTIME_REFERENCE"; } | sha256sum | cut -d' ' -f1)"
          tag="$COMPILED_SEED_REPOSITORY:seed-$seed_key"
          if digest="$(inspect_digest "$tag")"; then
            reuse_mode=immutable-seed-hit
          else
            common_args=(
              --build-arg "RUNTIME_DEPS_IMAGE=$RUNTIME_REFERENCE"
              --build-arg "BASELINE_CACHE_IMAGE=runtime-deps"
              --build-arg "COMPILED_SEED_IMAGE=$RUNTIME_REFERENCE"
              --build-arg "SOURCE_DATE_EPOCH=0"
              --build-arg "MAIN_COMMIT=$CANDIDATE_COMMIT"
              --build-arg "BUILD_SOURCE_TREE=$CANDIDATE_TREE"
              --build-arg "GATE_SOURCE_DIGEST=$(jq -r .gate_source_digest identity.json)"
              --build-arg "RUNTIME_DEPENDENCY_DIGEST=$(jq -r .runtime_dependency_digest identity.json)"
              --build-arg "IMAGE_INPUT_DIGEST=$(jq -r .image_input_digest identity.json)"
              --build-arg "POLICY_DIGEST=$(jq -r .policy_digest identity.json)"
              --build-arg "TOOLCHAIN_DIGEST=$(jq -r .toolchain_digest identity.json)"
              --build-arg "TARGET_PLATFORM=linux/amd64"
            )
            git archive --format=tar "$CANDIDATE_TREE" | docker buildx build --platform linux/amd64 --provenance=false \
              -f build/gate/Dockerfile --target compiled-seed \
              --build-context "runtime-deps=docker-image://$RUNTIME_REFERENCE" \
              "${common_args[@]}" --push -t "$tag" -
            digest="$(inspect_digest "$tag")"
            reuse_mode=built
          fi
          printf 'compiled_cache reuse_mode=%s digest=%s\n' "$reuse_mode" "$digest"
          echo "reference=$COMPILED_SEED_REPOSITORY@$digest" >> "$GITHUB_OUTPUT"

      - name: Build or reuse complete ECI image material
        id: final
        shell: bash
        env:
          RUNTIME_REFERENCE: ${{ steps.runtime.outputs.reference }}
          COMPILED_REFERENCE: ${{ steps.compiled.outputs.reference }}
        run: |
          set -euo pipefail
          inspect_digest() {
            docker buildx imagetools inspect "$1" --format '{{json .Manifest.Digest}}' 2>/tmp/final-inspect.err | jq -er '.'
          }
          tag="$FINAL_REPOSITORY:material-$CANDIDATE_TREE"
          common_args=(
            --build-arg "RUNTIME_DEPS_IMAGE=$RUNTIME_REFERENCE"
            --build-arg "BASELINE_CACHE_IMAGE=runtime-deps"
            --build-arg "COMPILED_SEED_IMAGE=$COMPILED_REFERENCE"
            --build-arg "SOURCE_DATE_EPOCH=0"
            --build-arg "MAIN_COMMIT=$CANDIDATE_COMMIT"
            --build-arg "BUILD_SOURCE_TREE=$CANDIDATE_TREE"
            --build-arg "GATE_SOURCE_DIGEST=$(jq -r .gate_source_digest identity.json)"
            --build-arg "RUNTIME_DEPENDENCY_DIGEST=$(jq -r .runtime_dependency_digest identity.json)"
            --build-arg "IMAGE_INPUT_DIGEST=$(jq -r .image_input_digest identity.json)"
            --build-arg "POLICY_DIGEST=$(jq -r .policy_digest identity.json)"
            --build-arg "TOOLCHAIN_DIGEST=$(jq -r .toolchain_digest identity.json)"
            --build-arg "TARGET_PLATFORM=linux/amd64"
          )
          if digest="$(inspect_digest "$tag")"; then
            reuse_mode=immutable-final-hit
          else
            git archive --format=tar "$CANDIDATE_TREE" | docker buildx build --platform linux/amd64 --provenance=false \
              -f build/gate/Dockerfile --target final-image \
              --build-context "runtime-deps=docker-image://$RUNTIME_REFERENCE" \
              "${common_args[@]}" --push -t "$tag" -
            digest="$(inspect_digest "$tag")"
            reuse_mode=built
          fi
          final_reference="$FINAL_REPOSITORY@$digest"
          printf 'complete_eci_material reuse_mode=%s reference=%s\n' "$reuse_mode" "$final_reference"

          cp build/gate/Dockerfile /tmp/material-artifacts.Dockerfile
          printf '\nFROM scratch AS material-artifacts\nCOPY --from=generation-one /super-dolphin-gate /artifacts/super-dolphin-gate\nCOPY --from=generation-one /opt/super-dolphin-gate/runtime/manifest.json /artifacts/runtime-manifest.json\nCOPY --from=generation-one /opt/super-dolphin-gate/source-snapshot/manifest.json /artifacts/source-snapshot-manifest.json\nCOPY --from=generation-one /opt/super-dolphin-gate/compiled-seed-manifest.json /artifacts/compiled-seed-manifest.json\n' >> /tmp/material-artifacts.Dockerfile
          git archive --format=tar "$CANDIDATE_TREE" | docker buildx build --platform linux/amd64 --provenance=false \
            -f /tmp/material-artifacts.Dockerfile --target material-artifacts \
            --build-context "runtime-deps=docker-image://$RUNTIME_REFERENCE" \
            "${common_args[@]}" --output type=local,dest=operator-artifacts -

          root=operator-artifacts/artifacts
          test -x "$root/super-dolphin-gate"
          jq -n \
            --arg final_reference "$final_reference" \
            --arg gate "sha256:$(sha256sum "$root/super-dolphin-gate" | cut -d' ' -f1)" \
            --arg seed "sha256:$(sha256sum "$root/runtime-manifest.json" | cut -d' ' -f1)" \
            --arg baseline "sha256:$(sha256sum "$root/source-snapshot-manifest.json" | cut -d' ' -f1)" \
            --arg compiled "sha256:$(sha256sum "$root/compiled-seed-manifest.json" | cut -d' ' -f1)" \
            '{authority:"non_authoritative_material",final_reference:$final_reference,gate_binary_sha256:$gate,runtime_seed_manifest_sha256:$seed,baseline_manifest_digest:$baseline,compiled_seed_manifest_sha256:$compiled}' \
            > content-hashes.json

      - uses: actions/upload-artifact@v4
        with:
          name: eci-image-material-${{ env.CANDIDATE_TREE }}
          if-no-files-found: error
          retention-days: 3
          path: |
            identity.json
            content-hashes.json
