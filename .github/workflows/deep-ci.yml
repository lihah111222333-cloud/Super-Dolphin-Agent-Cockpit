name: Deep CI

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 20 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go-race:
    name: Go race
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOFLAGS: -mod=readonly

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Resolve Go toolchain
        run: |
          set -euo pipefail
          real_go="$(command -v go)"
          if [ "$real_go" = "$GITHUB_WORKSPACE/scripts/go" ]; then
            echo "REAL_GO_BIN resolved to scripts/go wrapper; refusing" >&2
            exit 1
          fi
          echo "REAL_GO_BIN=$real_go" >> "$GITHUB_ENV"
          "$real_go" version
          "$real_go" env GOPATH GOMOD GOOS GOARCH

      - name: Download Go modules
        run: |
          "$REAL_GO_BIN" mod download

      - name: Run Go race test suite
        run: |
          set -euo pipefail
          make test
          git diff --exit-code -- go.mod go.sum internal/archtest/freeze_registry.go

  playwright:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: cmd/agent-terminal/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cmd/agent-terminal/frontend/package-lock.json

      - name: Show Node environment
        run: |
          node -v
          npm -v

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Run Playwright E2E
        run: npm run test:e2e

      - name: Check frontend generated files
        run: |
          git -C ../../.. diff --exit-code -- cmd/agent-terminal/frontend/scripts/size-guard-baseline.json cmd/agent-terminal/frontend/package-lock.json

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure
          path: |
            cmd/agent-terminal/frontend/test-results
            cmd/agent-terminal/frontend/playwright-report
          if-no-files-found: ignore
