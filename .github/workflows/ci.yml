name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  SUPER_DOLPHIN_GUARD_FAIL_ON_DRIFT: "1"

jobs:
  commit-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Commit guard
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: ./scripts/ci_commit_guard.sh

  build-and-test:
    needs: commit-guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-app/package-lock.json
      - name: Install Linux WebView dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install mcp-lsp test dependencies
        run: |
          go install golang.org/x/tools/gopls@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          rustup component add rust-analyzer
      - name: Prepare embedded frontend assets
        run: make frontend-app-build
      - name: Frontend embed verify
        run: make frontend-embed-verify
      - name: Vet
        run: make vet
      - name: Build
        run: make build-plain
      - name: Test
        shell: bash
        run: |
          mapfile -t go_packages < <(go list ./cmd/... ./internal/... ./pkg/... ./scripts/...)
          ./scripts/test_with_guard.sh "${go_packages[@]}" -count=1 -timeout 180s
      - name: Sqlc verify
        run: make sqlc-verify
      - name: Codemap check
        run: make codemap-check
      - name: Project map check
        run: make project-map-check
      - name: Capability contract check
        run: make capcontract-check
      - name: Validate skills
        run: python3 scripts/validate_super_agent_skills.py

  lint:
    needs: commit-guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-app/package-lock.json
      - name: Lint GitHub Actions workflows
        run: make actionlint
      - name: Install Linux WebView dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Prepare embedded frontend assets
        run: make frontend-app-build
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --new-from-rev=origin/main --timeout=5m

  frontend-app:
    needs: commit-guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-app/package-lock.json
      - name: Install frontend-app dependencies
        working-directory: frontend-app
        run: npm ci
      - name: Lint frontend-app
        working-directory: frontend-app
        run: npm run lint
      - name: Test frontend-app
        working-directory: frontend-app
        run: npm test
      - name: Build frontend-app
        working-directory: frontend-app
        run: npm run build
      - name: Frontend embed verify
        run: make frontend-embed-verify

  cross-platform-smoke:
    needs: commit-guard
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Capability contract check
        shell: pwsh
        run: go run ./scripts/capcontract --check
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-app/package-lock.json
      - name: Cross-platform desktop and sidecar smoke
        shell: pwsh
        run: ./scripts/ci_cross_platform_smoke.ps1
