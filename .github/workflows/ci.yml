name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go-test:
    name: Go test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOFLAGS: -mod=readonly

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Resolve Go toolchain
        run: |
          set -euo pipefail
          real_go="$(command -v go)"
          if [ "$real_go" = "$GITHUB_WORKSPACE/scripts/go" ]; then
            echo "REAL_GO_BIN resolved to scripts/go wrapper; refusing" >&2
            exit 1
          fi
          echo "REAL_GO_BIN=$real_go" >> "$GITHUB_ENV"
          "$real_go" version
          "$real_go" env GOPATH GOMOD GOOS GOARCH

      - name: Download Go modules
        run: |
          "$REAL_GO_BIN" mod download

      - name: Run Go CI test suite
        run: |
          set -euo pipefail
          make ci-l1
          git diff --exit-code -- go.mod go.sum internal/archtest/freeze_registry.go

  go-check:
    name: Go vet/build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOFLAGS: -mod=readonly

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Resolve Go toolchain
        run: |
          set -euo pipefail
          real_go="$(command -v go)"
          if [ "$real_go" = "$GITHUB_WORKSPACE/scripts/go" ]; then
            echo "REAL_GO_BIN resolved to scripts/go wrapper; refusing" >&2
            exit 1
          fi
          echo "REAL_GO_BIN=$real_go" >> "$GITHUB_ENV"
          "$real_go" version
          "$real_go" env GOPATH GOMOD GOOS GOARCH

      - name: Download Go modules
        run: |
          "$REAL_GO_BIN" mod download

      - name: Run Go guard
        run: |
          set -euo pipefail
          make guard

      - name: Verify sqlc generated code
        run: |
          set -euo pipefail
          make sqlc-verify

      - name: Run Go vet and build checks
        run: |
          set -euo pipefail
          "$REAL_GO_BIN" vet ./...
          "$REAL_GO_BIN" build ./...
          git diff --exit-code -- go.mod go.sum internal/archtest/freeze_registry.go

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: cmd/agent-terminal/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cmd/agent-terminal/frontend/package-lock.json

      - name: Show Node environment
        run: |
          node -v
          npm -v

      - name: Run frontend checks
        run: |
          set -euo pipefail
          npm ci
          node scripts/size-guard.cjs
          node scripts/check-templates.cjs
          npm exec -- vitest run
          npm exec -- vite build
          git -C ../../.. diff --exit-code -- cmd/agent-terminal/frontend/scripts/size-guard-baseline.json cmd/agent-terminal/frontend/package-lock.json
