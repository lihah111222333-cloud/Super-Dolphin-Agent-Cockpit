<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Super Dolphin</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top, rgba(73, 97, 164, 0.35), transparent 42%),
        linear-gradient(180deg, #111827 0%, #0f172a 100%);
      color: #e5e7eb;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: transparent;
    }

    main {
      width: min(640px, calc(100vw - 48px));
      padding: 32px;
      border-radius: 24px;
      background: rgba(15, 23, 42, 0.82);
      box-shadow: 0 24px 80px rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(16px);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 5vw, 3rem);
      line-height: 1;
    }

    p {
      margin: 0;
      color: #cbd5e1;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main>
    <h1>Super Dolphin</h1>
    <p>Desktop runtime is connected. Frontend assets can be replaced without changing the Wails lifecycle bridge.</p>
  </main>
</body>
</html>
