id: government-enterprise/data-analysis-brief
version: 1
title:
  zh: 数据分析简报
  en: Data Analysis Brief
description:
  zh: 对数据材料进行口径确认、指标解释和异常提示，生成复核后简报。
  en: Validate data scope, explain metrics, surface anomalies, and create a reviewed analysis brief.
category: government-enterprise
business_flow: 数据分析
output_types: [pptx, markdown, pdf, json]
tags: [政企, 数据, 简报, 指标]
estimated_nodes: 5
requires_review: true
supports_schedule: true
ui_schema:
  - key: title
    type: text
    required: true
    label: { zh: 简报主题 }
    placeholder: { zh: 例如：营商环境月度数据分析 }
    help: { zh: 用于简报标题。 }
  - key: data_scope
    type: text
    required: true
    label: { zh: 数据口径 }
    placeholder: { zh: 例如：本月全市企业开办数据 }
    help: { zh: 口径不明确时必须先确认。 }
  - key: source_materials
    type: file_ref
    required: true
    label: { zh: 数据材料 }
    placeholder: { zh: CSV/XLSX 摘要、台账路径或 sharedfile }
    help: { zh: 模板不直接接外部数据库。 }
  - key: output_format
    type: select
    required: true
    label: { zh: 输出格式 }
    placeholder: { zh: pptx }
    help: { zh: pptx/pdf 需要可用生成能力。 }
    options:
      - value: pptx
        label: { zh: PPTX }
      - value: markdown
        label: { zh: Markdown }
      - value: pdf
        label: { zh: PDF }
      - value: json
        label: { zh: JSON }
  - key: reviewer
    type: reviewer
    required: true
    label: { zh: 复核人 }
    placeholder: { zh: 例如：数据负责人 }
    help: { zh: 复核数据口径和解释边界。 }
  - key: output_path
    type: path
    required: true
    label: { zh: 保存目录 }
    placeholder:
      zh: reports/workflows/government_enterprise_data_analysis_brief/{{run_id}}/
    help: { zh: 分析过程和最终简报写入该目录。 }
dag_template:
  dag_key_template: government_enterprise_data_analysis_brief_{{run_id}}
  title_template: "{{title}} - 数据分析简报"
  description_template: "基于 {{data_scope}} 和 {{source_materials}} 生成数据分析简报。"
  trigger: manual
  final_node_key: final_brief
  nodes:
    - node_key: scope
      title: 口径确认
      node_type: agent
      assigned_to: government_enterprise_data_analysis_brief_scope_runner
      depends_on: []
      config:
        ui:
          stage_key: scope
          stage_title: 口径确认
          execution_mode: sequential
          operation_summary: 明确数据范围、字段口径和分析限制。
          model_action: 生成口径说明和缺失项。
          skills: [prompt_list]
          input_sources: ["{{data_scope}}", "{{source_materials}}"]
          expected_outputs: ["{{output_path}}scope.md"]
        outputs:
          to_sharedfile:
            path: "{{output_path}}scope.md"
            lock_mode: exclusive
          to_node_result: true
    - node_key: quality
      title: 数据质量检查
      node_type: agent
      assigned_to: government_enterprise_data_analysis_brief_quality_runner
      depends_on: [scope]
      config:
        ui:
          stage_key: quality
          stage_title: 质量检查
          execution_mode: sequential
          operation_summary: 检查缺失值、异常值和统计口径冲突。
          model_action: 输出数据质量提示和人工确认项。
          skills: [prompt_list, command_list]
          input_sources: [scope]
          expected_outputs: ["{{output_path}}quality.md"]
        outputs:
          to_sharedfile:
            path: "{{output_path}}quality.md"
            lock_mode: exclusive
          to_node_result: true
    - node_key: insight
      title: 指标解读
      node_type: agent
      assigned_to: government_enterprise_data_analysis_brief_insight_runner
      depends_on: [quality]
      config:
        ui:
          stage_key: insight
          stage_title: 指标解读
          execution_mode: sequential
          operation_summary: 提炼趋势、异常和管理建议。
          model_action: 生成可审阅的数据解释。
          skills: [prompt_list]
          input_sources: [quality]
          expected_outputs: ["{{output_path}}insight.md"]
        outputs:
          to_sharedfile:
            path: "{{output_path}}insight.md"
            lock_mode: exclusive
          to_node_result: true
    - node_key: review
      title: 数据复核
      node_type: agent
      assigned_to: government_enterprise_data_analysis_brief_review_runner
      depends_on: [insight]
      config:
        ui:
          stage_key: review
          stage_title: 数据复核
          execution_mode: sequential
          operation_summary: 生成给 {{reviewer}} 的数据口径复核清单。
          model_action: 标注解释边界、风险和需确认结论。
          skills: [prompt_list]
          input_sources: [insight]
          expected_outputs: ["{{output_path}}review.md"]
        outputs:
          to_sharedfile:
            path: "{{output_path}}review.md"
            lock_mode: exclusive
          to_node_result: true
    - node_key: final_brief
      title: 最终数据简报
      node_type: agent
      assigned_to: government_enterprise_data_analysis_brief_final_runner
      depends_on: [review]
      config:
        ui:
          stage_key: final
          stage_title: 最终交付
          execution_mode: sequential
          operation_summary: 生成复核后的 {{output_format}} 数据简报。
          model_action: 输出最终简报和可追溯数据说明。
          skills: [prompt_list, command_list]
          input_sources: [scope, quality, insight, review]
          expected_outputs: ["{{output_path}}final.{{output_format}}"]
        outputs:
          to_sharedfile:
            path: "{{output_path}}final.{{output_format}}"
            lock_mode: exclusive
          to_node_result: true
validation:
  sharedfile_prefixes:
  - reports/workflows/
  - dag/
  require_review_before_final: true
  require_final_node_key: true
final_output:
  node_key: final_brief
  kind: sharedfile
  path_template: "{{output_path}}final.{{output_format}}"
