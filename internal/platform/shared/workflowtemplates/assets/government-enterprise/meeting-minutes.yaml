id: government-enterprise/meeting-minutes
version: 1
title:
  zh: 会议纪要
  en: Meeting Minutes
description:
  zh: 从会议材料中提取议题、决议、任务和督办清单，生成复核后纪要。
  en: Extract agenda items, decisions, tasks, and follow-up lists from meeting materials.
category: government-enterprise
business_flow: 会议督办
output_types: [docx, markdown, pdf, json]
tags: [政企, 会议, 纪要, 督办]
estimated_nodes: 5
requires_review: true
supports_schedule: false
ui_schema:
  - key: title
    type: text
    required: true
    label: { zh: 会议名称 }
    placeholder: { zh: 例如：6月项目推进会 }
    help: { zh: 用于纪要标题。 }
  - key: source_materials
    type: file_ref
    required: true
    label: { zh: 会议材料 }
    placeholder: { zh: 转写稿、录音摘要、会议记录或 sharedfile 路径 }
    help: { zh: 模型只基于可见材料生成纪要。 }
  - key: output_format
    type: select
    required: true
    label: { zh: 输出格式 }
    placeholder: { zh: docx }
    help: { zh: docx/pdf 需要发现可用转换能力。 }
    options:
      - value: docx
        label: { zh: Word }
      - value: markdown
        label: { zh: Markdown }
      - value: pdf
        label: { zh: PDF }
      - value: json
        label: { zh: JSON 任务清单 }
  - key: reviewer
    type: reviewer
    required: true
    label: { zh: 复核人 }
    placeholder: { zh: 例如：会议主持人 }
    help: { zh: 外发或督办前需要人工确认。 }
  - key: output_path
    type: path
    required: true
    label: { zh: 保存目录 }
    placeholder:
      zh: reports/workflows/government_enterprise_meeting_minutes/{{run_id}}/
    help: { zh: 最终纪要和任务清单的保存位置。 }
dag_template:
  dag_key_template: government_enterprise_meeting_minutes_{{run_id}}
  title_template: "{{title}} - 会议纪要"
  description_template: "提取会议要点、决议和督办事项。"
  trigger: manual
  final_node_key: final_minutes
  nodes:
    - node_key: topics
      title: 议题提取
      node_type: agent
      assigned_to: government_enterprise_meeting_minutes_topics_runner
      depends_on: []
      config:
        ui:
          stage_key: topics
          stage_title: 议题提取
          execution_mode: sequential
          operation_summary: 从会议材料中提取议题、发言人和关键事实。
          model_action: 形成议题结构和原文依据。
          skills: [prompt_list, shared_file_list]
          input_sources: ["{{source_materials}}"]
          expected_outputs: ["{{output_path}}topics.md"]
        outputs:
          to_sharedfile:
            path: "{{output_path}}topics.md"
            lock_mode: exclusive
          to_node_result: true
    - node_key: decisions
      title: 决议归纳
      node_type: agent
      assigned_to: government_enterprise_meeting_minutes_decisions_runner
      depends_on: [topics]
      config:
        ui:
          stage_key: decisions
          stage_title: 决议归纳
          execution_mode: sequential
          operation_summary: 归纳会议决议、待确认事项和风险表述。
          model_action: 区分已决事项和待确认事项。
          skills: [prompt_list]
          input_sources: [topics]
          expected_outputs: ["{{output_path}}decisions.md"]
        outputs:
          to_sharedfile:
            path: "{{output_path}}decisions.md"
            lock_mode: exclusive
          to_node_result: true
    - node_key: actions
      title: 督办清单
      node_type: agent
      assigned_to: government_enterprise_meeting_minutes_actions_runner
      depends_on: [decisions]
      config:
        ui:
          stage_key: actions
          stage_title: 任务拆解
          execution_mode: sequential
          operation_summary: 拆解责任人、截止时间、交付物和跟踪口径。
          model_action: 输出结构化督办清单。
          skills: [prompt_list]
          input_sources: [decisions]
          expected_outputs: ["{{output_path}}actions.json"]
        outputs:
          to_sharedfile:
            path: "{{output_path}}actions.json"
            lock_mode: exclusive
          to_node_result: true
    - node_key: review
      title: 纪要复核
      node_type: agent
      assigned_to: government_enterprise_meeting_minutes_review_runner
      depends_on: [actions]
      config:
        ui:
          stage_key: review
          stage_title: 纪要复核
          execution_mode: sequential
          operation_summary: 生成给 {{reviewer}} 的纪要复核清单。
          model_action: 检查事实归属、责任事项和外发风险。
          skills: [prompt_list]
          input_sources: [topics, decisions, actions]
          expected_outputs: ["{{output_path}}review.md"]
        outputs:
          to_sharedfile:
            path: "{{output_path}}review.md"
            lock_mode: exclusive
          to_node_result: true
    - node_key: final_minutes
      title: 最终纪要
      node_type: agent
      assigned_to: government_enterprise_meeting_minutes_final_runner
      depends_on: [review]
      config:
        ui:
          stage_key: final
          stage_title: 最终交付
          execution_mode: sequential
          operation_summary: 生成复核后的纪要和督办清单 sharedfile。
          model_action: 输出最终材料路径和摘要。
          skills: [prompt_list, command_list]
          input_sources: [review]
          expected_outputs: ["{{output_path}}final.{{output_format}}"]
        outputs:
          to_sharedfile:
            path: "{{output_path}}final.{{output_format}}"
            lock_mode: exclusive
          to_node_result: true
validation:
  sharedfile_prefixes:
  - reports/workflows/
  - dag/
  require_review_before_final: true
  require_final_node_key: true
final_output:
  node_key: final_minutes
  kind: sharedfile
  path_template: "{{output_path}}final.{{output_format}}"
