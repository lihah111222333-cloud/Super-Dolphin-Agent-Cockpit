id: government-enterprise/project-briefing
version: 1
title:
  zh: 项目汇报
  en: Project Briefing
description:
  zh: 汇总项目目标、里程碑、风险和资源需求，生成汇报材料。
  en: Turn project goals, milestones, risks, and resource needs into briefing materials.
category: government-enterprise
business_flow: 项目管理
output_types: [docx, pdf]
tags: [政企, 项目, 汇报, PPT]
estimated_nodes: 5
requires_review: true
supports_schedule: false
trust:
  level: builtin
  source: super-dolphin
compatibility:
  runtime: dag-v2
  node_types: [agent]
  required_capabilities:
    - workflow.node.agent
    - workflow.output.sharedfile
    - workflow.output.artifact
    - workflow.final_output
ui_schema:
  - key: title
    type: text
    required: true
    label: { zh: 项目名称 }
    placeholder: { zh: 例如：政务服务一网通办升级项目 }
    help: { zh: 用于汇报材料标题。 }
  - key: source_materials
    type: file_ref
    required: true
    label: { zh: 输入材料 }
    placeholder: { zh: 项目计划、里程碑、风险台账 }
    help: { zh: 可包含 sharedfile 路径。 }
  - key: output_format
    type: select
    required: true
    label: { zh: 输出格式 }
    placeholder: { zh: docx }
    help: { zh: 生成真实 docx/pdf artifact 文件，最终产物可下载打开。 }
    options:
      - value: docx
        label: { zh: DOCX }
      - value: pdf
        label: { zh: PDF }
  - key: reviewer
    type: reviewer
    required: true
    label: { zh: 复核人 }
    placeholder: { zh: 例如：项目负责人 }
    help: { zh: 复核节点输出审阅清单。 }
  - key: output_path
    type: path
    required: true
    label: { zh: 保存目录 }
    placeholder:
      zh: reports/workflows/government_enterprise_project_briefing/{{run_id}}/
    help: { zh: 最终材料写入该目录。 }
dag_template:
  dag_key_template: government_enterprise_project_briefing_{{run_id}}
  title_template: "{{title}} - 项目汇报"
  description_template: "从 {{source_materials}} 生成项目汇报材料和复核意见。"
  trigger: manual
  final_node_key: final_briefing
  nodes:
    - node_key: facts
      title: 项目信息梳理
      node_type: agent
      assigned_to: government_enterprise_project_briefing_facts_runner
      depends_on: []
      config:
        ui:
          stage_key: facts
          stage_title: 信息梳理
          execution_mode: sequential
          operation_summary: 梳理项目目标、范围、里程碑和关键干系人。
          model_action: 抽取汇报事实和缺失项。
          skills: [prompt_list, shared_file_list]
          input_sources: ["{{source_materials}}"]
          expected_outputs: ["{{output_path}}facts.md"]
        outputs:
          to_sharedfile:
            path: "{{output_path}}facts.md"
            lock_mode: exclusive
          to_node_result: false
    - node_key: risk
      title: 风险与资源分析
      node_type: agent
      assigned_to: government_enterprise_project_briefing_risk_runner
      depends_on: [facts]
      config:
        inputs:
          from_sharedfiles:
            - "{{output_path}}facts.md"
        ui:
          stage_key: risk
          stage_title: 风险分析
          execution_mode: sequential
          operation_summary: 识别进度、资源、协同和合规风险。
          model_action: 生成风险矩阵和待确认项。
          skills: [prompt_list]
          input_sources: [facts]
          expected_outputs: ["{{output_path}}risk.md"]
        outputs:
          to_sharedfile:
            path: "{{output_path}}risk.md"
            lock_mode: exclusive
          to_node_result: false
    - node_key: draft
      title: 汇报草稿
      node_type: agent
      assigned_to: government_enterprise_project_briefing_draft_runner
      depends_on: [risk]
      config:
        inputs:
          from_sharedfiles:
            - "{{output_path}}facts.md"
            - "{{output_path}}risk.md"
        ui:
          stage_key: draft
          stage_title: 汇报草稿
          execution_mode: sequential
          operation_summary: 生成汇报提纲、页面结构和讲稿要点。
          model_action: 组织管理层可读的汇报材料。
          skills: [prompt_list]
          input_sources: [facts, risk]
          expected_outputs: ["{{output_path}}draft.md"]
        outputs:
          to_sharedfile:
            path: "{{output_path}}draft.md"
            lock_mode: exclusive
          to_node_result: false
    - node_key: review
      title: 汇报复核
      node_type: agent
      assigned_to: government_enterprise_project_briefing_review_runner
      depends_on: [draft]
      config:
        inputs:
          from_sharedfiles:
            - "{{output_path}}draft.md"
        ui:
          stage_key: review
          stage_title: 汇报复核
          execution_mode: sequential
          operation_summary: 生成给 {{reviewer}} 的审阅意见和改稿清单。
          model_action: 检查项目事实、风险表达和汇报口径。
          skills: [prompt_list]
          input_sources: [draft]
          expected_outputs: ["{{output_path}}review.md"]
        outputs:
          to_sharedfile:
            path: "{{output_path}}review.md"
            lock_mode: exclusive
          to_node_result: false
    - node_key: final_briefing
      title: 最终汇报材料
      node_type: agent
      assigned_to: government_enterprise_project_briefing_final_runner
      depends_on: [review]
      config:
        inputs:
          from_sharedfiles:
            - "{{output_path}}draft.md"
            - "{{output_path}}review.md"
        first_turn: |
          请基于 draft.md 和 review.md 生成最终项目汇报材料正文。
          必须只输出一个 JSON 对象，不要使用 Markdown 代码块。
          JSON schema: {"document_text":"完整项目汇报材料正文"}
          document_text 必须包含项目概况、关键进展、风险资源、管理建议、下一步计划和复核结论。
        ui:
          stage_key: final
          stage_title: 最终交付
          execution_mode: sequential
          operation_summary: 生成复核后的 {{output_format}} 汇报材料；能力不足时显式提示。
          model_action: 输出最终材料和打开路径。
          skills: [prompt_list, command_list]
          input_sources: [draft, review]
          expected_outputs: ["{{output_path}}final.{{output_format}}"]
        outputs:
          to_artifact:
            source_tool: document_renderer
            source_text_field: document_text
            path_template: "{{output_path}}final.{{output_format}}"
            max_bytes: 10485760
            overwrite: replace
          to_node_result: false
validation:
  sharedfile_prefixes:
  - reports/workflows/
  - dag/
  require_review_before_final: true
  require_final_node_key: true
final_output:
  node_key: final_briefing
  kind: artifact
  path_template: "{{output_path}}final.{{output_format}}"
