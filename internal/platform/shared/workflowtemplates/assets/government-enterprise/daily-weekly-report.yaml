id: government-enterprise/daily-weekly-report
version: 1
title:
  zh: 日报/周报
  en: Daily or Weekly Report
description:
  zh: 汇总周期工作、风险、数据和下一步计划，生成可复核的工作报告。
  en: Summarize periodic work, risks, data, and next steps into a reviewable report.
category: government-enterprise
business_flow: 工作汇报
output_types: [docx, pdf]
tags: [政企, 日报, 周报, 汇报]
estimated_nodes: 5
requires_review: true
supports_schedule: true
trust:
  level: builtin
  source: super-dolphin
compatibility:
  runtime: dag-v2
  node_types: [agent]
  required_capabilities:
    - workflow.node.agent
    - workflow.output.sharedfile
    - workflow.output.artifact
    - workflow.final_output
ui_schema:
  - key: title
    type: text
    required: true
    label: { zh: 报告主题 }
    placeholder: { zh: 例如：数据治理专项周报 }
    help: { zh: 用于生成报告标题。 }
  - key: period
    type: text
    required: true
    label: { zh: 统计周期 }
    placeholder: { zh: 例如：2026年第25周 }
    help: { zh: 明确报告覆盖时间，不能由模型猜测。 }
  - key: source_materials
    type: file_ref
    required: true
    label: { zh: 输入材料 }
    placeholder: { zh: 工作台账、日报片段或 sharedfile 路径 }
    help: { zh: 支持多份材料路径或摘要。 }
  - key: output_format
    type: select
    required: true
    label: { zh: 输出格式 }
    placeholder: { zh: docx }
    help: { zh: 生成真实 docx/pdf artifact 文件，最终产物可下载打开。 }
    options:
      - value: docx
        label: { zh: DOCX }
      - value: pdf
        label: { zh: PDF }
  - key: reviewer
    type: reviewer
    required: true
    label: { zh: 复核人 }
    placeholder: { zh: 例如：部门负责人 }
    help: { zh: 复核通过后才把 final 节点作为最终材料。 }
  - key: timezone
    type: text
    required: true
    label: { zh: 时区 }
    placeholder: { zh: Asia/Shanghai }
    help: { zh: 定时场景默认使用 CRON_TZ=Asia/Shanghai，未明确时间必须确认。 }
  - key: output_path
    type: path
    required: true
    label: { zh: 保存目录 }
    placeholder:
      zh: reports/workflows/government_enterprise_daily_weekly_report/{{run_id}}/
    help: { zh: 必须位于 reports/workflows/ 或 dag/ 前缀下。 }
dag_template:
  dag_key_template: government_enterprise_daily_weekly_report_{{run_id}}
  title_template: "{{title}} - 日报周报"
  description_template: "汇总 {{period}} 的工作材料并生成复核后报告。"
  trigger: manual
  final_node_key: final_report
  nodes:
    - node_key: collect
      title: 材料汇总
      node_type: agent
      assigned_to: government_enterprise_daily_weekly_report_collect_runner
      depends_on: []
      config:
        ui:
          stage_key: collect
          stage_title: 材料汇总
          execution_mode: parallel
          operation_summary: 汇总 {{period}} 的工作事项、数据和问题清单。
          model_action: 抽取进展、风险、阻塞和下一步计划。
          skills: [shared_file_list, prompt_list]
          input_sources: ["{{source_materials}}"]
          expected_outputs: ["{{output_path}}collected.md"]
        outputs:
          to_sharedfile:
            path: "{{output_path}}collected.md"
            lock_mode: exclusive
          to_node_result: false
    - node_key: metrics
      title: 指标核对
      node_type: agent
      assigned_to: government_enterprise_daily_weekly_report_metrics_runner
      depends_on: []
      config:
        ui:
          stage_key: metrics
          stage_title: 指标核对
          execution_mode: parallel
          operation_summary: 核对台账指标、异常值和口径说明。
          model_action: 标注缺失字段和需人工确认的数据。
          skills: [prompt_list]
          input_sources: ["{{source_materials}}"]
          expected_outputs: ["{{output_path}}metrics.md"]
        outputs:
          to_sharedfile:
            path: "{{output_path}}metrics.md"
            lock_mode: exclusive
          to_node_result: false
    - node_key: draft
      title: 报告成稿
      node_type: agent
      assigned_to: government_enterprise_daily_weekly_report_draft_runner
      depends_on: [collect, metrics]
      config:
        inputs:
          from_sharedfiles:
            - "{{output_path}}collected.md"
            - "{{output_path}}metrics.md"
        ui:
          stage_key: draft
          stage_title: 报告成稿
          execution_mode: sequential
          operation_summary: 按政企汇报口径生成 {{output_format}} 报告草稿。
          model_action: 合并材料并生成结构化报告。
          skills: [prompt_list]
          input_sources: [collect, metrics]
          expected_outputs: ["{{output_path}}draft.md"]
        outputs:
          to_sharedfile:
            path: "{{output_path}}draft.md"
            lock_mode: exclusive
          to_node_result: false
    - node_key: review
      title: 复核意见
      node_type: agent
      assigned_to: government_enterprise_daily_weekly_report_review_runner
      depends_on: [draft]
      config:
        inputs:
          from_sharedfiles:
            - "{{output_path}}draft.md"
        ui:
          stage_key: review
          stage_title: 报告复核
          execution_mode: sequential
          operation_summary: 生成给 {{reviewer}} 的复核意见和需确认问题。
          model_action: 检查事实、口径和表达风险。
          skills: [prompt_list]
          input_sources: [draft]
          expected_outputs: ["{{output_path}}review.md"]
        outputs:
          to_sharedfile:
            path: "{{output_path}}review.md"
            lock_mode: exclusive
          to_node_result: false
    - node_key: final_report
      title: 最终报告
      node_type: agent
      assigned_to: government_enterprise_daily_weekly_report_final_runner
      depends_on: [review]
      config:
        inputs:
          from_sharedfiles:
            - "{{output_path}}draft.md"
            - "{{output_path}}review.md"
        first_turn: |
          请基于 draft.md 和 review.md 生成最终日报/周报正文。
          必须只输出一个 JSON 对象，不要使用 Markdown 代码块。
          JSON schema: {"document_text":"完整日报/周报正文"}
          document_text 必须包含统计周期、关键进展、指标说明、风险问题、下阶段计划和复核结论。
        ui:
          stage_key: final
          stage_title: 最终交付
          execution_mode: sequential
          operation_summary: 生成复核后的最终报告并写入 sharedfile。
          model_action: 输出最终材料路径和摘要。
          skills: [prompt_list, command_list]
          input_sources: [draft, review]
          expected_outputs: ["{{output_path}}final.{{output_format}}"]
        outputs:
          to_artifact:
            source_tool: document_renderer
            source_text_field: document_text
            path_template: "{{output_path}}final.{{output_format}}"
            max_bytes: 10485760
            overwrite: replace
          to_node_result: false
validation:
  sharedfile_prefixes:
  - reports/workflows/
  - dag/
  require_review_before_final: true
  require_final_node_key: true
final_output:
  node_key: final_report
  kind: artifact
  path_template: "{{output_path}}final.{{output_format}}"
