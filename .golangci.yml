version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - cyclop
    - dupl
    - errcheck
    - errorlint
    - exhaustive
    - funlen
    - gocognit
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - loggercheck
    - lll
    - misspell
    - nakedret
    - nilerr
    - noctx
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    cyclop:
      max-complexity: 12
      package-average: 8.0
    dupl:
      threshold: 100
    funlen:
      lines: 80
      statements: 50
      ignore-comments: true
    gocognit:
      min-complexity: 18
    gocyclo:
      min-complexity: 15
    lll:
      line-length: 120
    nakedret:
      max-func-lines: 20
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - dupl
          - funlen
          - gocognit
          - gocyclo
          - cyclop

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
