run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosimple
    - typecheck

linters-settings:
  errcheck:
    exclude-functions:
      - (io.Closer).Close
      - (*os.File).Close
      - (net.Conn).Close
      - fmt.Fprintf
      - fmt.Fprintln

issues:
  exclude-dirs:
    - vendor
    - third_party
    - node_modules
  exclude-dirs-use-default: true
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
    - path: scripts/
      linters:
        - errcheck
    - path: \.tmp
      linters:
        - errcheck
        - unused
  max-issues-per-linter: 50
  max-same-issues: 5
