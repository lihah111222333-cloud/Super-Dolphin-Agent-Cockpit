version: "2"
sql:
  - engine: "sqlite"
    queries: "sql/queries/"
    schema:
      - "internal/platform/db/sqlite/migrations/001_baseline.sql"
    gen:
      go:
        package: "sqlc"
        out: "internal/store/sqlc"
        emit_json_tags: true
        emit_db_tags: true
        emit_empty_slices: true
        emit_interface: true
        query_parameter_limit: 0
        omit_unused_structs: true
        emit_pointers_for_null_types: true
        initialisms:
          - id
          - ui
          - dag
          - rpc
          - sql
          - uuid
          - cwd
        overrides:
          # JSON TEXT 列 → json.RawMessage
          - column: "agent_threads.config"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - column: "agent_threads.prompt_snapshot"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - column: "agent_status.output_tail"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - column: "agent_provider_binding.config"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - column: "ui_preferences.value"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - column: "system_logs.extra"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - column: "audit_events.payload"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - column: "bus_exception_logs.payload"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - column: "agent_interactions.payload"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - column: "topology_approvals.payload"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - column: "hook_pending_reviews.payload"
