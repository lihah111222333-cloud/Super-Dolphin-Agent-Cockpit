version: "2"
sql:
  - engine: "postgresql"
    queries: "sql/queries/"
    schema:
      - "migrations/001_baseline.sql"
      - "migrations/0022_binding_session_uuid.sql"
      - "migrations/0023_dag_watcher_phase1.sql"
      - "migrations/0024_prompt_versions_description.sql"
      - "migrations/0025_agent_thread_config_override.sql"
      - "migrations/0031_prompt_snapshot.sql"
      - "migrations/0032_agent_memory_identity.sql"
      - "migrations/0034_thread_agent_routing.sql"
      - "migrations/0035_agent_feedback_events.sql"
      - "migrations/0036_seed_orchestrator_prompt.sql"
      - "migrations/0037_thread_pending_launch.sql"
      - "migrations/0041_prompt_routing_tests.sql"
      - "migrations/0042_prompt_templates_router_priority.sql"
      - "migrations/0045_cron_jobs.sql"
      - "migrations/0046_session_insights.sql"
      - "migrations/0048_binding_codex_identity.sql"
      - "migrations/0049_prompt_template_sections.sql"
      - "migrations/0050_seed_prompt_template_sections_example.sql"
      - "migrations/0051_seed_main_default_sections.sql"
      - "migrations/0052_seed_test_prompts_with_sections.sql"
      - "migrations/0053_prompt_template_match_when.sql"
      - "migrations/0054_seed_main_default_match_when.sql"
      - "migrations/0055_seed_match_when_test_prompts.sql"
      - "migrations/0056_seed_simple_match_when_demo.sql"
      - "migrations/0057_seed_claude_style_prompt.sql"
      - "migrations/0058_seed_claude_style_sections.sql"
      - "migrations/0059_rename_claude_style_sections_to_builtin_keys.sql"
      - "migrations/0060_turn_dedupe_registry.sql"
      - "migrations/0063_agent_thread_name.sql"
      - "migrations/0064_skill_candidates.sql"
      - "migrations/0066_skill_candidates_repo_fp_widen.sql"
      - "migrations/0067_thread_manually_renamed.sql"
    gen:
      go:
        package: "sqlc"
        out: "internal/store/sqlc"
        sql_package: "pgx/v5"
        sql_driver: "github.com/jackc/pgx/v5"
        emit_json_tags: true
        emit_db_tags: true
        emit_empty_slices: true
        emit_interface: true
        query_parameter_limit: 1
        omit_unused_structs: true
        emit_pointers_for_null_types: true
        initialisms:
          - id
          - ui
          - uuid
        overrides:
          - db_type: "pg_catalog.timestamptz"
            go_type: "time.Time"
          - db_type: "pg_catalog.timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          - db_type: "pg_catalog.timestamp"
            go_type: "time.Time"
          - db_type: "pg_catalog.timestamp"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          - db_type: "pg_catalog.jsonb"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - db_type: "pg_catalog.jsonb"
            nullable: true
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - db_type: "pg_catalog.json"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - db_type: "pg_catalog.json"
            nullable: true
            go_type:
              import: "encoding/json"
              type: "RawMessage"
