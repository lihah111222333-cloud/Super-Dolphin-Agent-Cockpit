version: "2"
sql:
  - engine: "sqlite"
    queries: "sql/queries"
    schema:
      - "../../internal/platform/db/sqlite/migrations/001_baseline.sql"
    gen:
      go:
        package: "sqlc"
        out: "store/sqlc"
        emit_json_tags: true
        emit_db_tags: true
        emit_empty_slices: true
        query_parameter_limit: 0
        omit_unused_structs: false
        emit_pointers_for_null_types: true
        initialisms:
          - id
          - rpc
          - sql
          - uuid
          - cwd
        overrides:
          - column: "command_cards.args_schema"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - column: "command_card_versions.args_schema"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - column: "prompt_templates.variables"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - column: "prompt_templates.tags"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - column: "prompt_templates.match_when"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - column: "prompt_versions.variables"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - column: "prompt_versions.tags"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - column: "task_acks.metadata"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - column: "task_dags.metadata"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - column: "task_dag_runs.events"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - column: "task_dag_runs.metadata"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - column: "task_dag_nodes.depends_on"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - column: "task_dag_nodes.config"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - column: "task_dag_nodes.result"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - column: "task_dag_nodes.reads"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - column: "task_dag_nodes.writes"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - column: "task_dag_wakeups.prompt_payload"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - column: "workspace_runs.metadata"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
