version: "2"
sql:
  - engine: "postgresql"
    queries: "sql/queries"
    schema:
      - "../../migrations/001_baseline.sql"
      - "../../migrations/0022_binding_session_uuid.sql"
      - "../../migrations/0023_dag_watcher_phase1.sql"
      - "../../migrations/0024_prompt_versions_description.sql"
      - "../../migrations/0032_agent_memory_identity.sql"
      - "../../migrations/0072_dag_v2_dag_columns.sql"
      - "../../migrations/0073_dag_v2_node_columns.sql"
      - "../../migrations/0074_dag_v2_runs.sql"
      - "../../migrations/0075_dag_v2_compat.sql"
      # NOTE: migration 0083 (spawning_thread_id) is intentionally NOT listed
      # here because its idempotent guard wraps ALTER TABLE in a DO $$ ... $$
      # PL/pgSQL block which sqlc v1.30's static parser cannot read. The
      # generated TaskDagNode model was hand-edited to include the column;
      # future sqlc regeneration after the migration runs through a real PG
      # database should discover the column directly from the live schema.
      # See migration 0083 header for the idempotency rationale.
    gen:
      go:
        package: "sqlc"
        out: "store/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        omit_unused_structs: true
